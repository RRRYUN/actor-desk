<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>매니저</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap">
<style>html,body{margin:0;padding:0}[hidden]{display:none!important}</style>
<style id="css">
@font-face{font-family:"Pretendard";src:url("fonts/PretendardVariable.woff2") format("woff2-variations"),url("fonts/PretendardVariable.woff2") format("woff2");font-weight:45 920;font-display:swap}
/* 탭 네 개(배우)·다섯 개(매니저). 공고는 누르면 요약 창, 날짜는 달력 탭에 모음 */
:root{
  --bg:#F2F4F7; --card:#FFFFFF; --fg:#191F28; --sub:#5B6573; --line:#E3E7EC; --soft:#EEF1F5;
  --accent:#3182F6; --accent-ink:#FFFFFF; --accent-soft:#E8F2FF;
  --good:#0B8A5C; --good-soft:#E3F5EC; --try:#2F6FDB; --try-soft:#E8F0FE;
  --hard:#A3620A; --hard-soft:#FDF1DD; --urgent:#D63B3F; --urgent-soft:#FDECEC;
  --plum:#7A4DD8; --plum-soft:#F1EBFD;
  --c-due:#D63B3F; --c-due-s:#FDECEC; --c-result:#0B8A5C; --c-result-s:#E3F5EC;
  --c-aud:#7A4DD8; --c-aud-s:#F1EBFD; --c-shoot:#2F6FDB; --c-shoot-s:#E8F0FE;
  --c-event:#C2570C; --c-event-s:#FDEBDD; --c-etc:#5B6573; --c-etc-s:#EEF1F5;
  --scrim:rgba(12,17,24,.5);
  --f-ko:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-num:"Google Sans","Pretendard",-apple-system,"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101317; --card:#1A1E24; --fg:#ECEFF3; --sub:#A2ABB7; --line:#2C323A; --soft:#242930;
  --accent:#5B9BFF; --accent-ink:#0B1220; --accent-soft:#1D2B42;
  --good:#45C58F; --good-soft:#163428; --try:#7AA8FF; --try-soft:#1C2A44;
  --hard:#E7A84B; --hard-soft:#3A2C14; --urgent:#FF6B6E; --urgent-soft:#3D1D1F;
  --plum:#B597FF; --plum-soft:#2B2340;
  --c-due:#FF6B6E; --c-due-s:#3D1D1F; --c-result:#45C58F; --c-result-s:#163428;
  --c-aud:#B597FF; --c-aud-s:#2B2340; --c-shoot:#7AA8FF; --c-shoot-s:#1C2A44;
  --c-event:#FF9D5C; --c-event-s:#3A2414; --c-etc:#A2ABB7; --c-etc-s:#242930;
  --scrim:rgba(0,0,0,.62); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --card:#1A1E24; --fg:#ECEFF3; --sub:#A2ABB7; --line:#2C323A; --soft:#242930;
  --accent:#5B9BFF; --accent-ink:#0B1220; --accent-soft:#1D2B42;
  --good:#45C58F; --good-soft:#163428; --try:#7AA8FF; --try-soft:#1C2A44;
  --hard:#E7A84B; --hard-soft:#3A2C14; --urgent:#FF6B6E; --urgent-soft:#3D1D1F;
  --plum:#B597FF; --plum-soft:#2B2340;
  --c-due:#FF6B6E; --c-due-s:#3D1D1F; --c-result:#45C58F; --c-result-s:#163428;
  --c-aud:#B597FF; --c-aud-s:#2B2340; --c-shoot:#7AA8FF; --c-shoot-s:#1C2A44;
  --c-event:#FF9D5C; --c-event-s:#3A2414; --c-etc:#A2ABB7; --c-etc-s:#242930;
  --scrim:rgba(0,0,0,.62); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ko);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.actor{font-size:19px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.ic{display:inline-flex;flex:none}
.ic svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm svg{width:17px;height:17px}

/* 머리 */
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.35}
.brand strong{font-size:20px;font-weight:780;letter-spacing:-.01em}
.brand span{font-size:15px;color:var(--sub)}
.swap{border:1px solid var(--line);background:var(--card);border-radius:999px;height:42px;padding:0 16px;font-size:15px;font-weight:650;cursor:pointer}

/* 탭 */
.tabwrap{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px;margin:0 -2px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--card);border-radius:22px;padding:5px}
.tab{position:relative;border:0;background:none;border-radius:17px;min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:14.5px;font-weight:650;color:var(--sub);cursor:pointer;padding:6px 2px;white-space:nowrap}
.actor .tab{font-size:16.5px;min-height:66px}
.tab[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.tab em{position:absolute;top:4px;left:calc(50% + 6px);min-width:21px;height:21px;padding:0 6px;border-radius:999px;background:var(--c-due);color:#fff;font-style:normal;font-size:12.5px;font-weight:700;display:grid;place-items:center;font-family:var(--f-num)}

/* 공통 */
.view{display:flex;flex-direction:column;gap:26px}
.hello{display:flex;flex-direction:column;gap:6px;padding:4px 4px 0}
h1{font-size:27px;line-height:1.3;font-weight:780;letter-spacing:-.02em;margin:0;text-wrap:balance}
.actor h1{font-size:30px}
.lead{margin:0;color:var(--sub)}
section.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;flex-direction:column;gap:2px;padding:0 4px}
.sec-head h2{font-size:21px;margin:0;font-weight:760;letter-spacing:-.01em}
.actor .sec-head h2{font-size:24px}
.sec-head p{margin:0;font-size:15.5px;color:var(--sub)}
.actor .sec-head p{font-size:17px}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.empty{background:var(--card);border-radius:24px;padding:20px;color:var(--sub);margin:0}
.note{margin:0;font-size:15.5px;color:var(--sub);background:var(--soft);border-radius:14px;padding:10px 14px}
.actor .note{font-size:17px}
.warn{margin:0;font-size:15.5px;color:var(--urgent);background:var(--urgent-soft);border-radius:14px;padding:10px 14px}
.label{font-size:14.5px;color:var(--sub);font-weight:650;display:block}
.foot{color:var(--sub);font-size:14.5px;text-align:center;margin:8px 0 0}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dl.facts dt{color:var(--sub);white-space:nowrap}
dl.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}

/* 버튼 */
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:52px;padding:8px 16px;border-radius:16px;border:0;font-weight:700;cursor:pointer;text-decoration:none;text-align:center;font-size:16.5px;color:var(--fg)}
.actor .btn{min-height:62px;font-size:19px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.plum{background:var(--plum);color:#fff}
.btn.ghost{background:var(--soft)}
.btn.link{background:var(--accent-soft);color:var(--accent)}
.btn.small{min-height:42px;font-size:15px;border-radius:12px;padding:6px 14px}
.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--fg)}
.btn:disabled{opacity:.5;cursor:default}
a.ext{color:var(--accent);font-weight:650;text-decoration:none;display:inline-flex;align-items:center;gap:2px;white-space:nowrap}
a.ext:hover{text-decoration:underline}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:42px;padding:6px 14px;font-size:15.5px;font-weight:650;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* 표시 */
.tag{display:inline-flex;align-items:center;height:28px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:650;white-space:nowrap}
.actor .tag{font-size:15.5px;height:31px}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.try{background:var(--try-soft);color:var(--try)}
.tag.hard{background:var(--hard-soft);color:var(--hard)}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tag.must{background:var(--urgent-soft);color:var(--urgent)}
.tag.opt{background:var(--soft);color:var(--sub)}
.tag.miss{background:var(--hard-soft);color:var(--hard)}
.tag.ok{background:var(--good-soft);color:var(--good)}
.k-due{--k:var(--c-due);--ks:var(--c-due-s)} .k-result{--k:var(--c-result);--ks:var(--c-result-s)}
.k-audition{--k:var(--c-aud);--ks:var(--c-aud-s)} .k-shoot{--k:var(--c-shoot);--ks:var(--c-shoot-s)}
.k-event{--k:var(--c-event);--ks:var(--c-event-s)} .k-etc{--k:var(--c-etc);--ks:var(--c-etc-s)}
.tag.kind{background:var(--ks);color:var(--k)}
.due{font-weight:700;font-size:15px;color:var(--sub)}
.actor .due{font-size:17px}
.due.urgent{color:var(--urgent)}
.jst{display:inline-flex;align-items:center;gap:7px;font-size:15px;font-weight:650;color:var(--sub)}
.actor .jst{font-size:17px}
.jst::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.jst.want,.jst.st-callback{color:var(--plum)} .jst.st-applied{color:var(--try)} .jst.st-cast{color:var(--good)}
.jst.need{color:var(--hard)}

/* 공고 카드 */
.jcard{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:5px;background:var(--card);border-radius:22px;padding:18px 20px;cursor:pointer;width:100%;min-width:0}
.jcard:hover{box-shadow:inset 0 0 0 2px var(--line)}
.jcard:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.jtop{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.jtitle{display:block;font-size:19px;font-weight:740;line-height:1.4;text-wrap:balance}
.actor .jtitle{font-size:22px}
.jrole{display:block;color:var(--sub);margin:0}
.jfoot{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin-top:6px}
.jfoot .more{margin-left:auto;display:inline-flex;align-items:center;gap:2px;color:var(--accent);font-weight:700}
details.fold{background:var(--card);border-radius:22px;padding:16px 20px}
details.fold summary{cursor:pointer;font-weight:700}
details.fold[open] summary{margin-bottom:10px}
.mini{display:flex;flex-direction:column}
.mini button{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.mini button:first-child{border-top:0}
.mini button span:last-child{color:var(--sub);font-size:15px;white-space:nowrap}

/* 필름메이커스 바로 가기 */
.fm{background:var(--card);border-radius:24px;padding:18px 20px;display:grid;grid-template-columns:1fr auto;gap:12px 16px;align-items:center}
.fm-text{display:flex;flex-direction:column;line-height:1.4}
.fm-text strong{font-size:19px;font-weight:760}
.actor .fm-text strong{font-size:21px}
.fm-text span{color:var(--sub);font-size:15.5px}
.actor .fm-text span{font-size:17px}
.fm .fm-go{background:var(--fg);color:var(--bg);min-height:54px;border-radius:16px;padding:0 20px}
.fm-links{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px}
.fm-links a{display:inline-flex;align-items:center;gap:4px;min-height:42px;padding:0 14px;border-radius:12px;background:var(--soft);color:var(--fg);font-weight:650;font-size:15.5px;text-decoration:none}
.actor .fm-links a{font-size:17px;min-height:48px}
@media (max-width:520px){.fm{grid-template-columns:1fr}.fm .fm-go{width:100%}}

/* 할 일·가까운 일정 */
.todo{background:var(--card);border-radius:24px;padding:8px 20px}
.todo button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:14px 0;border-top:1px solid var(--line);cursor:pointer}
.todo button:first-child{border-top:0}
.todo b{font-size:14.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:3px 9px;white-space:nowrap}
.todo b.urgent{color:var(--urgent);background:var(--urgent-soft)}
.todo span{min-width:0}
.todo .ic{color:var(--sub)}
.soon{display:flex;flex-direction:column;gap:2px;background:var(--card);border-radius:24px;padding:8px 20px}
.soon-row{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.soon-row:first-child{border-top:0}
.dtile{border-radius:16px;background:var(--ks,var(--accent-soft));color:var(--k,var(--accent));display:flex;flex-direction:column;align-items:center;padding:8px 0;line-height:1.15;font-family:var(--f-num)}
.dtile b{font-size:24px}
.dtile span{font-size:13px;font-weight:650}
.soon-row strong{display:block;font-size:18px}
.actor .soon-row strong{font-size:20px}
.soon-row span.sub{color:var(--sub);display:block}

/* 요약 창 */
dialog.sheet{border:0;padding:0;width:min(660px,calc(100% - 32px));max-width:none;max-height:calc(100dvh - 40px);border-radius:28px;background:var(--card);color:var(--fg);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:var(--scrim)}
dialog.sheet:focus,dialog.sheet:focus-visible{outline:none}
.btn.done{background:var(--good-soft);color:var(--good)}
@media (max-width:560px){dialog.sheet{width:100%;max-height:94dvh;margin:auto 0 0;border-radius:24px 24px 0 0}}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--card);padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sheet-titles{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.sheet-titles h2{margin:0;font-size:22px;line-height:1.35;font-weight:780;text-wrap:balance}
.actor .sheet-titles h2{font-size:25px}
.close{flex:none;border:0;background:var(--soft);border-radius:999px;height:44px;padding:0 18px;font-weight:700;font-size:16px;cursor:pointer}
.sheet-body{padding:4px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.blk{display:flex;flex-direction:column;gap:10px;padding:18px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0}
.blk h3{margin:0;font-size:15.5px;font-weight:700;color:var(--sub)}
.actor .blk h3{font-size:17px}
.blk p{margin:0}
ul.dates{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
ul.dates li{display:grid;grid-template-columns:10px 96px 1fr;column-gap:10px;align-items:baseline}
.actor ul.dates li{grid-template-columns:10px 112px 1fr}
ul.dates .dot{width:10px;height:10px;border-radius:50%;background:var(--k);align-self:center}
ul.dates .dk{font-weight:700;color:var(--k)}
ul.dates .dw{font-weight:650}
ul.dates .dn{grid-column:3;color:var(--sub);font-size:15.5px}
.actor ul.dates .dn{font-size:17px}
ul.dates li.muted .dot{background:var(--line)} ul.dates li.muted .dk{color:var(--sub)}
ul.reqs,ul.bul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
ul.reqs li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
ul.reqs .rtags{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:none;max-width:45%}
ul.bul li{position:relative;padding-left:16px}
ul.bul li::before{content:"";position:absolute;left:2px;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--sub)}
ol.steps{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:12px}
ol.steps li{padding-left:2px}
ol.steps li::marker{font-family:var(--f-num);font-weight:700;color:var(--sub)}
.acts{display:flex;flex-direction:column;gap:12px;padding:18px 0 4px;border-top:1px solid var(--line)}
.picked{margin:0;background:var(--plum-soft);color:var(--plum);border-radius:16px;padding:12px 16px;font-weight:650}
.picked.pass{background:var(--soft);color:var(--sub)}
.textbtn{border:0;background:none;color:var(--sub);text-decoration:underline;cursor:pointer;font-weight:600;padding:8px 0;align-self:flex-start}
.fallback{display:flex;flex-direction:column;gap:10px;background:var(--hard-soft);border-radius:16px;padding:14px 16px}
.fallback p{margin:0}
.copyrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px 12px}
.copyrow code{font-family:var(--f-num);font-size:15px;word-break:break-all;flex:1 1 200px;min-width:0}
.copy{border:0;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:650;height:40px;padding:0 16px;border-radius:999px;cursor:pointer;flex:none}
.copy.done{background:var(--good);color:#fff}
details.bodybox summary{cursor:pointer;color:var(--accent);font-weight:650;padding:4px 0}
pre.body{margin:6px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--f-ko);font-size:15px;line-height:1.65;background:var(--soft);border-radius:14px;padding:14px;max-height:320px;overflow:auto}

/* 달력 */
.cal{background:var(--card);border-radius:24px;padding:14px 10px 16px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px 8px}
.cal-head h2{margin:0;font-size:22px;font-weight:760}
.navbtn{width:46px;height:46px;border-radius:14px;border:0;background:var(--soft);display:grid;place-items:center;cursor:pointer}
.cal-tools{display:flex;gap:8px;align-items:center}
.todaybtn{border:0;background:var(--soft);border-radius:12px;height:46px;padding:0 14px;font-weight:650;cursor:pointer}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 6px 12px;font-size:14.5px;color:var(--sub)}
.actor .legend{font-size:16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--k)}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.wd{text-align:center;font-size:14px;color:var(--sub);font-weight:650;padding:2px 0 6px}
.wd.sun{color:var(--c-due)}
.day{border:0;background:none;border-radius:14px;min-height:88px;padding:5px 3px;display:flex;flex-direction:column;align-items:stretch;gap:3px;cursor:pointer;min-width:0}
.day:hover{background:var(--soft)}
.day.sel{background:var(--accent-soft)}
.day.past .dnum,.day.past .marks{opacity:.4}
.dnum{font-family:var(--f-num);font-size:15.5px;font-weight:600;width:30px;height:30px;display:grid;place-items:center;border-radius:50%;align-self:center}
.day.today .dnum{background:var(--accent);color:var(--accent-ink);opacity:1}
.marks{display:flex;flex-direction:column;gap:3px;min-width:0}
.mk{display:block;font-size:12.5px;font-weight:700;line-height:1.25;padding:2px 4px;border-radius:6px;background:var(--ks);color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:clip;text-align:center}
.mk i{display:none}
.mk-more{font-size:12px;color:var(--sub);text-align:center}
@media (max-width:540px){
  .day{min-height:60px;padding:4px 1px;border-radius:12px}
  .marks{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:3px}
  .mk{padding:0;background:none}.mk b{display:none}
  .mk i{display:block;width:8px;height:8px;border-radius:50%;background:var(--k)}
  .mk-more{display:none}
}
.agenda{display:flex;flex-direction:column;gap:18px}

  const b=el("button",{class:cls||"copy",type:"button",text:L});
  b.addEventListener("click",()=>{
    const ok=()=>{b.textContent="복사됐어요";b.classList.add("done");setTimeout(()=>{b.textContent=L;b.classList.remove("done")},1800)};
    const fb=()=>{if(!target)return;const s=getSelection(),r=document.createRange();r.selectNodeContents(target);s.removeAllRanges();s.addRange(r);b.textContent="길게 눌러 복사"};
    try{navigator.clipboard.writeText(text).then(ok,fb)}catch(_){fb()}
  });
  return b;
}

function burstAt(r,kind){
  try{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return}catch(_){}
  const host=curDlg&&curDlg.open?curDlg:document.body,layer=el("div",{class:"burst","aria-hidden":"true"});
  layer.style.left=(r.left+r.width/2)+"px";layer.style.top=(r.top+r.height/2)+"px";
  const n=kind==="heart"?7:10,cols=["var(--accent)","var(--plum)","var(--good)","#FF6FA0","var(--hard)"];
  for(let i=0;i<n;i++){
    const s=el("span",{class:"bp"+(kind==="heart"?"":" spark")}),a=(-90+(i-(n-1)/2)*(150/(n-1)))*Math.PI/180,d=48+Math.random()*30;
    s.style.setProperty("--dx",(Math.cos(a)*d).toFixed(1)+"px");s.style.setProperty("--dy",(Math.sin(a)*d-10).toFixed(1)+"px");
    s.style.setProperty("--rot",(Math.random()*50-25).toFixed(0)+"deg");s.style.animationDelay=(i*22)+"ms";
    if(kind==="heart")s.innerHTML=HEART;else s.style.setProperty("--c",cols[i%cols.length]);
    layer.append(s);

  host.append(layer);setTimeout(()=>layer.remove(),1300);
}

function shootWindow(j){
  const s=(j.dates||[]).filter(x=>x.k==="shoot"); if(!s.length) return null;
  let a=Infinity,b=-Infinity; s.forEach(x=>{a=Math.min(a,dayNum(x.d));b=Math.max(b,dayNum(x.e||x.d))}); return [a,b];
}

  return days.length?days.map(shortDay).join(", "):"없음";

function conflicts(j){

function tokVal(tok,j){

function toks(j){const s=[j.subject||"",...(j.extra||[])].join("\n");return [...new Set([...s.matchAll(/［([^］]*)］/g)].map(m=>m[1].trim()))]}

/* ---------- 날짜 모으기 ---------- */
function jobDates(j){
  const ds=(j.dates||[]).slice();
  if(!ds.some(x=>x.k==="due")) ds.push({k:"due",d:dayStr(dueDay(j))});
  return ds.sort((a,b)=>(!!isLoose(a)-!!isLoose(b))||dayNum(a.d)-dayNum(b.d)||KORDER.indexOf(a.k)-KORDER.indexOf(b.k));
}
function jobActive(j){return (j.status==="new"&&isOpen(j)&&j.pick!=="pass")||j.status==="applied"||j.status==="callback"||j.status==="cast"}
function calItems(){
  const out=[];
  S.jobs.forEach(j=>{ if(!jobActive(j)) return;
    jobDates(j).forEach(x=>{ if(x.k==="due"&&j.status!=="new") return; out.push(Object.assign({},x,{job:j})) }); });
  S.events.forEach(e=>out.push({k:"event",d:e.date,t:e.time||"",title:e.title,note:[e.kind,e.time,e.place,e.note].filter(Boolean).join(" · "),ev:e}));
  return out;
}
function isLoose(it){return it.approx||(it.e&&dayNum(it.e)-dayNum(it.d)>14)}
function byDay(items){
  const m=new Map();
  items.forEach(it=>{ if(isLoose(it)||!it.d) return;
    const a=dayNum(it.d),b=it.e?dayNum(it.e):a;
    for(let n=a;n<=b;n++){ if(!m.has(n)) m.set(n,[]); m.get(n).push(it) } });
  m.forEach(v=>v.sort((x,y)=>KORDER.indexOf(x.k)-KORDER.indexOf(y.k)));
  return m;
}
function itemTitle(it){return it.ev?it.title:it.job.title}
function itemNote(it){
  if(it.ev) return it.note;
  const j=it.job,parts=[];
  if(it.k==="due"){
    parts.push((it.t?it.t+" ":"")+"마감");
    if(j.pick==="want") parts.push(mode==="actor"?"하고 싶다고 하셨어요":"배우님이 하고 싶대요");
    else if(!j.pick) parts.push(mode==="actor"?"아직 안 고르셨어요":"배우님 답 기다림");
  }else{
    if(it.note) parts.push(it.note); else parts.push(KINDS[it.k]);
    if(it.t&&!(it.note||"").includes(it.t)) parts.push(it.t);
    if(it.k==="shoot"&&j.status!=="cast") parts.push("뽑히면");
    if((it.k==="result"||it.k==="audition")&&j.status==="new") parts.push("지원하면");
  }
  return parts.join(" · ");
}
function whenText(x){
  if(x.approx||isLoose(x)) return x.w||(shortDay(x.d)+(x.e?" ~ "+shortDay(x.e):"")+" 무렵");
  return shortDay(x.d)+(x.e?" ~ "+shortDay(x.e):"")+(x.t?" "+x.t:"");
}

/* ---------- 저장 ---------- */
function b64enc(str){const b=new TextEncoder().encode(str);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const bin=atob(String(b64).replace(/\s/g,""));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
function gh(method,body){
  return fetch(API+(method==="GET"?"?v="+Date.now():""),{method,cache:"no-store",
    headers:{"Authorization":"Bearer "+KEY,"Accept":"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"},
    body:body?JSON.stringify(body):undefined});
}
async function load(){
  const r=await gh("GET");
  if(!r.ok){const e=new Error("load");e.status=r.status;throw e}
  const j=await r.json();sha=j.sha;S=JSON.parse(b64dec(j.content));normalize();
}
let saveChain=Promise.resolve();
function save(msg){
  clearTimeout(qTimer);
  S.updated=new Date().toISOString();
  render();
  if(!KEY||readOnly){toast("이 화면에서는 저장되지 않아요",3000);return Promise.resolve(false)}
  const text=JSON.stringify(S,null,1);busy++;
  saveChain=saveChain.then(()=>putData(text,msg)).finally(()=>{busy--});
  return saveChain;
}
async function putData(text,msg){
  toast(msg||"저장하는 중이에요…");
  try{
    const r=await gh("PUT",{message:"페이지에서 저장: "+String(msg||"고침").replace(/…$/,""),content:b64enc(text),sha});
    if(r.ok){const j=await r.json();sha=j.content.sha;toast("저장됐어요",1500);return true}
    if(r.status===409||r.status===422){await load();render();toast("다른 기기에서 바뀐 내용을 불러왔어요. 한 번 더 해 주세요",3800);return false}
    if(r.status===401||r.status===403||r.status===404){readOnly=true;render();toast("이 열쇠로는 저장할 수 없어요",3500);return false}
    toast("저장하지 못했어요. 잠시 뒤에 다시 해 주세요",3500);return false;
  }catch(_){toast("인터넷 연결을 확인해 주세요",3500);return false}
}
async function refresh(){
  if(busy||qTimer&&ui._q||!KEY) return;
  try{const old=sha;await load();if(sha!==old)render()}catch(_){}
}

async function runPaste(){

  if(p.busy||!samp) return;
  p.busy=true;p.err="";p.result=null;p.ctl=new AbortController();render();
  try{
    const r=await samp.json(pastePrompt(p.text,p.url),{signal:p.ctl.signal});
    p.result=normalizeJob(r,p.url);
    if(!p.result) p.err=r&&r.none?"맞는 배역이 없대요. "+String(r.none).slice(0,200):"정리 결과를 읽지 못했어요. 한 번 더 눌러 주세요.";
  }catch(e){
    const c=e&&e.code;

    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){p.err="이 화면에서는 Claude 정리 기능을 쓸 수 없어요. 아래 '직접 입력해서 넣기'를 써 주세요.";samp=null}
    else if(c==="rate_limited") p.err="잠시 뒤에 다시 눌러 주세요.";
    else if(c==="prompt_too_large") p.err="공고가 너무 길어요. 배역·마감·지원 방법 부분만 붙여 넣어 주세요.";
    else if(c==="invalid_json") p.err="정리 결과를 읽지 못했어요. 한 번 더 눌러 주세요.";
    else if(c==="session_expired") p.err="claude.ai에 다시 로그인한 뒤 눌러 주세요.";
    else p.err="정리하지 못했어요. 잠시 뒤에 다시 해 주세요.";

  v.append(sec("메일에 들어가는 배우 정보",null,el("div",{class:"card"},facts([["이름",p.name+" ("+p.birth+"년생, 여)"],["키·몸무게",p.height+"cm · "+p.weight+"kg"],["연락처",p.phone+" / "+p.email],["학력",p.school],["수상",p.award],["특기",p.skills],["포트폴리오",p.site]]))));
  return v;
}
function vidEditor(){
  const vs=S.profile.videos||[],box=el("div",{class:"list"});
  vs.forEach((v,i)=>{
    if(ui.vEdit===i){box.append(vidForm(v,i));return}
    const cb=el("input",{type:"checkbox",id:"vd-"+i,checked:v.on!==false,disabled:readOnly});
    cb.addEventListener("change",()=>{v.on=cb.checked;queueSave("기본 영상을 저장했어요")});
    box.append(el("div",{class:"vrow"},el("label",{class:"check",for:"vd-"+i},cb,el("span",null,v.t,el("small",{text:v.u.replace(/^https?:\/\//,"")}))),
      el("div",{class:"vacts"},extLink(v.u,"열기"),readOnly?null:el("button",{class:"textbtn",type:"button",text:"고치기",onclick:()=>{ui.vEdit=i;render()}}))));
  });
  if(ui.vEdit==="new") box.append(vidForm(null,-1));
  else if(!readOnly) box.append(el("button",{class:"btn ghost",type:"button",style:"margin:10px 0 12px",text:"영상 추가",onclick:()=>{ui.vEdit="new";render()}}));
  return box;
}
function vidForm(v,i){
  const t=el("input",{type:"text",id:"vf-t",placeholder:"예: 연극 〈○○〉 무대"}),u=el("input",{type:"url",id:"vf-u",placeholder:"https://"});
  t.value=v?v.t:"";u.value=v?v.u:"";
  const f=el("form",{class:"vform"},field("영상 이름",t,true),field("링크",u,true),
    el("div",{class:"btns"},el("button",{class:"btn primary",type:"submit",text:"저장"}),el("button",{class:"btn ghost",type:"button",text:"그만두기",onclick:()=>{ui.vEdit=null;render()}})),
    v?el("button",{class:"textbtn",type:"button",text:"이 영상 목록에서 빼기",onclick:()=>{const id=vidId(v);S.profile.videos.splice(i,1);S.jobs.forEach(j=>{if(Array.isArray(j.vids))j.vids=j.vids.filter(x=>x!==id)});ui.vEdit=null;save()}}):null);
  f.addEventListener("submit",e=>{e.preventDefault();const tt=t.value.trim(),uu=u.value.trim();
    if(!tt||!/^https?:\/\//.test(uu)){toast("영상 이름과 https로 시작하는 링크를 넣어 주세요",2800);return}
    if(v){v.t=tt;v.u=uu}else S.profile.videos.push({id:"v"+Date.now().toString(36),t:tt,u:uu,on:true});ui.vEdit=null;save()});
  return f;
}
function keyCard(){
  const base=location.origin+location.pathname,actor=base+"#k="+encodeURIComponent(KEY)+"&r=actor",mine=base+"#k="+encodeURIComponent(KEY)+"&r=manager";
  return el("div",{class:"card"},
    el("p",{text:"아래 링크를 카톡으로 배우님께 한 번만 보내 주세요. 배우님이 한 번 누르면 그 휴대폰에 열쇠가 저장돼서, 다음부터는 평소 주소로 열려요."}),
    el("div",{class:"copyrow"},el("span",{text:"배우님용 링크"}),copyBtn(actor,null)),
    el("div",{class:"copyrow"},el("span",{text:"내 다른 기기용 링크 (매니저 화면)"}),copyBtn(mine,null)),
    el("p",{class:"warn",text:"링크 안에 열쇠가 들어 있어요. 단톡방이나 다른 사람에게는 보내지 마세요. 새어 나가면 GitHub에서 열쇠를 지우고 새로 만들면 돼요."}),
    facts([["평소 주소",base]]),
    el("button",{class:"textbtn",type:"button",text:"이 기기에서 열쇠 지우기",onclick:()=>{try{localStorage.removeItem("desk-key");localStorage.removeItem("desk-role")}catch(_){}location.replace(base)}}));
}
function siteCard(){
  const p=S.profile,u=el("p",{class:"url",text:p.site.replace(/^https?:\/\//,"").replace(/\/$/,"")});
  return el("div",{class:"card"},u,el("div",{class:"btns"},extBtn(p.site,"사이트 열기","primary"),copyBtn(p.site,u,"주소 복사","btn ghost")));
}
function meView(){
  const v=el("div",{class:"view"}),p=S.profile;
  v.append(el("div",{class:"hello"},el("h1",{text:"내 정보"}),el("p",{class:"lead",text:"매니저에게 알려 주실 정보, 웹사이트, 필름메이커스 계정, 영상과 프로필을 모았어요."})));
  const af=INFO.filter(x=>x.who!=="manager"),filled=af.filter(x=>info()[x.k]).length;
  v.append(sec("매니저에게 알려 주실 정보",(filled===af.length?"모두 알려 주셨어요. 바뀌면 고쳐 주세요.":af.length+"가지 중 "+filled+"가지 알려 주셨어요.")+" 지원 메일에 자동으로 들어가요.",el("div",{class:"card"},infoForm(infoFields(af),"info","저장하기"))));
  v.append(sec("촬영 안 되는 날",null,availCard()));
  v.append(sec("내 포트폴리오 웹사이트","캐스팅 담당자에게 보내는 사이트예요. 사진·이력·영상이 다 들어 있어요.",siteCard()));
  v.append(sec("필름메이커스 계정","오디션 공고가 올라오는 사이트예요.",fmAccountCard()));
  v.append(sec("연기 영상",null,el("div",{class:"links"},...p.videos.map(x=>extBtn(x.u,x.t,"ghost")))));
  v.append(sec("내 프로필 정보","지원 메일에 들어가는 정보예요. 틀린 게 있으면 매니저에게 알려 주세요.",el("div",{class:"card"},facts([["이름",p.name+" ("+p.birth+"년생)"],["키·몸무게",p.height+"cm · "+p.weight+"kg"],["연락처",p.phone],["이메일",p.email],["학력",p.school],["수상",p.award],["특기",p.skills]]))));
  v.append(sec("준비할 것","있으면 지원할 수 있는 공고가 늘어나요. 다 되면 매니저가 '있음'으로 바꿔요.",kitStatusList()));
  v.append(el("p",{class:"lead",style:"padding:0 4px",text:"궁금한 건 매니저에게 편하게 물어봐 주세요."}));
  return v;
}

/* ---------- 그리기 ---------- */
function render(){
  const app=document.getElementById("app");
  let keepY=0;
  if(curDlg){curDlg._stale=true;if(curDlg._id===ui.open)keepY=curDlg.scrollTop}
  const t=curTab(),root=el("div",{class:"wrap"+(mode==="actor"?" actor":"")});
  root.append(header(),tabBar(),
    t==="home"?homeView():t==="jobs"?(mode==="manager"?managerJobs():actorJobs()):t==="cal"?calView():t==="prog"?progView():t==="find"?findView():t==="kit"?kitView():meView(),
    el("p",{class:"foot",text:"마지막 수정 "+fmtStamp(S.updated)+(mode==="manager"?" · 버튼을 누를 때마다 저장돼요":"")}));
  if(ui.enter){const vw=root.querySelector(".view");if(vw)vw.classList.add("enter")}
  ui.enter=false;ui.hop=null;
  const fresh=!(curDlg&&curDlg._id===ui.open)&&!ui.quiet;
  const dlg=ui.open?sheet():null;
  app.replaceChildren(root,...(dlg?[dlg]:[]));
  curDlg=dlg;
  if(dlg){dlg._id=ui.open;if(fresh)dlg.classList.add("pop");try{dlg.showModal()}catch(_){dlg.setAttribute("open","")}
    try{dlg.focus({preventScroll:true})}catch(_){}
    const y=keepY||ui.sheetY; if(y) dlg.scrollTop=y; ui.sheetY=0}
}
function readKey(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(h.get("k")){
    KEY=h.get("k");ROLE=h.get("r")==="manager"?"manager":"actor";
    try{localStorage.setItem("desk-key",KEY);localStorage.setItem("desk-role",ROLE)}catch(_){}
    history.replaceState(null,"",location.pathname+location.search);return;
  }
  try{KEY=localStorage.getItem("desk-key");ROLE=localStorage.getItem("desk-role")||"actor"}catch(_){}
}
function lockView(msg){
  const inp=el("input",{class:"inline",type:"password",id:"key-in",autocomplete:"off",placeholder:"github_pat_ 로 시작하는 열쇠"});
  const f=el("form",{class:"card"},
    el("p",{class:"big-msg",text:"열쇠가 있어야 볼 수 있어요"}),
    el("p",{class:"lead",text:msg||"배우님은 매니저가 카톡으로 보낸 링크를 한 번 눌러 주세요. 그러면 이 휴대폰에서 계속 열려요."}),
    el("label",{class:"label",for:"key-in",text:"매니저: 열쇠 붙여 넣기"}),inp,
    el("button",{class:"btn primary",type:"submit",text:"열기"}));
  f.addEventListener("submit",e=>{e.preventDefault();const k=inp.value.trim();if(!k)return;
    KEY=k;ROLE="manager";try{localStorage.setItem("desk-key",k);localStorage.setItem("desk-role","manager")}catch(_){};start()});
  document.title="매니저";
  document.getElementById("app").replaceChildren(el("div",{class:"wrap"},el("div",{class:"hello"},el("h1",{text:"매니저"})),f));
}
async function start(){
  if(!KEY){lockView();return}
  document.getElementById("app").replaceChildren(el("div",{class:"wrap"},el("p",{class:"lead",style:"padding:40px 4px",text:"불러오는 중이에요…"})));
  try{await load()}
  catch(e){lockView(e.status===401||e.status===403||e.status===404?"열쇠가 맞지 않거나 기간이 끝났어요. 매니저에게 새 링크를 받아 주세요.":"불러오지 못했어요. 인터넷 연결을 확인하고 다시 열어 주세요.");return}
  isOwner=ROLE==="manager";art={};readOnly=false;booted=true;
  if(isOwner){let m=null;try{m=localStorage.getItem("mgr-mode")}catch(_){}mode=m||"manager"}else mode="actor";
  document.title=S.profile.name+(mode==="manager"?" 매니저":" 배우님");
  ui.enter=true;render();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
readKey();start();
})();
</script>
